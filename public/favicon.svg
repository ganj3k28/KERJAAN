<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Dark backdrop frame for high contrast on all browser themes -->
  <rect width="128" height="128" rx="24" fill="#0B132B" />
  
  <!-- Left Slanted Polygon (Navy Blue) -->
  <polygon points="12,14 66,14 50,114 12,114" fill="#08204D" />
  
  <!-- Right Slanted Polygon (Bright Red) -->
  <polygon points="70,14 116,14 116,114 54,114" fill="#E10600" />
  
  <!-- Letter A (Navy block) -->
  <text x="36" y="90" font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" font-weight="900" font-style="italic" font-size="72" fill="#FFFFFF" text-anchor="middle">A</text>
  
  <!-- Letter N (Red block) -->
  <text x="86" y="90" font-family="'Arial Black', 'Impact', 'Trebuchet MS', sans-serif" font-weight="900" font-style="italic" font-size="72" fill="#FFFFFF" text-anchor="middle">N</text>
</svg>
